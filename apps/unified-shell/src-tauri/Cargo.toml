[package]
name = "unified-shell-tauri"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.1", features = [] }
ooxml-opc.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
word-engine = { path = "../../../crates/word-engine" }
excel-engine = { path = "../../../crates/excel-engine" }
ppt-engine = { path = "../../../crates/ppt-engine" }
render-core = { path = "../../../crates/render-core" }
crdt-collab = { path = "../../../crates/crdt-collab" }

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[[bin]]
name = "unified-shell-tauri"
path = "src/main.rs"

[[bin]]
name = "aether-hub"
path = "src/bin/aether-hub.rs"

[[bin]]
name = "aether-writer"
path = "src/bin/aether-writer.rs"

[[bin]]
name = "aether-calc"
path = "src/bin/aether-calc.rs"

[[bin]]
name = "aether-slides"
path = "src/bin/aether-slides.rs"

[[bin]]
name = "aether-pdf"
path = "src/bin/aether-pdf.rs"
