[workspace]
resolver = "2"
members = [
    "crates/ooxml-opc",
    "crates/word-engine",
    "crates/excel-engine",
    "crates/ppt-engine",
    "crates/pdf-engine",
    "crates/render-core",
    "crates/crdt-collab",
    "crates/macro-engine",
    "crates/plugin-runtime",
    "crates/crypto-security",
    "crates/data-connectors",
    "crates/copilot-core",
    "apps/unified-shell/src-tauri"
]

[workspace.dependencies]
ooxml-opc = { path = "crates/ooxml-opc" }
pdf-engine = { path = "crates/pdf-engine" }
crdt-collab = { path = "crates/crdt-collab" }
macro-engine = { path = "crates/macro-engine" }
plugin-runtime = { path = "crates/plugin-runtime" }
crypto-security = { path = "crates/crypto-security" }
data-connectors = { path = "crates/data-connectors" }
copilot-core = { path = "crates/copilot-core" }
quick-xml = { version = "0.37", features = ["serialize", "async-tokio"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
thiserror = "2.0"
