[workspace]
resolver = "2"
members = [
    "crates/ooxml-opc",
    "crates/word-engine",
    "crates/excel-engine",
    "crates/ppt-engine",
    "crates/render-core",
    "apps/unified-shell/src-tauri"
]

[workspace.dependencies]
ooxml-opc = { path = "crates/ooxml-opc" }
quick-xml = { version = "0.37", features = ["serialize", "async-tokio"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
thiserror = "2.0"
