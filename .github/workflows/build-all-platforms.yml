name: Build & Upload All Platforms (Windows, Linux, macOS, Android, iOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-engine:
    name: Verify Rust Engine & Safety Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Formatting, Clippy & Workspace Parity Tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets

  build-desktop:
    name: Desktop - ${{ matrix.artifact_name }}
    needs: verify-engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: OpenOfficeRS-Windows-x64
            bundle_path: |
              apps/unified-shell/src-tauri/target/release/bundle/msi/*.msi
              apps/unified-shell/src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            artifact_name: OpenOfficeRS-Linux-x64
            bundle_path: |
              apps/unified-shell/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/unified-shell/src-tauri/target/release/bundle/deb/*.deb
          - platform: macos-14
            artifact_name: OpenOfficeRS-macOS-Universal
            bundle_path: |
              apps/unified-shell/src-tauri/target/release/bundle/dmg/*.dmg
              apps/unified-shell/src-tauri/target/release/bundle/macos/*.app
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04' && hashFiles('apps/unified-shell/package.json') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Tauri Desktop App
        if: hashFiles('apps/unified-shell/package.json') != ''
        working-directory: apps/unified-shell
        run: |
          npm install
          npx tauri build
      - name: Upload Desktop Artifact
        if: hashFiles('apps/unified-shell/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: warn

  build-android:
    name: Mobile - Android Universal APK
    needs: verify-engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: hashFiles('apps/unified-shell/package.json') != ''
      - name: Install Android NDK & Rust Targets
        if: hashFiles('apps/unified-shell/package.json') != ''
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build Tauri Android APK
        if: hashFiles('apps/unified-shell/package.json') != ''
        working-directory: apps/unified-shell
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npm install
          npx tauri android init
          npx tauri android build --apk
      - name: Upload Android APK Artifact
        if: hashFiles('apps/unified-shell/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenOfficeRS-Android-Universal-APK
          path: apps/unified-shell/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: warn

  build-ios:
    name: Mobile - iOS Unsigned IPA
    needs: verify-engine
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build Tauri iOS App & Package Unsigned IPA
        if: hashFiles('apps/unified-shell/package.json') != ''
        working-directory: apps/unified-shell
        run: |
          npm install
          npx tauri ios init
          npx tauri ios build --export-method debugging || true
          mkdir -p Payload
          cp -r src-tauri/gen/apple/build/arm64/OpenOfficeRS.app Payload/ || true
          zip -r OpenOfficeRS-iOS.ipa Payload
      - name: Upload iOS IPA Artifact
        if: hashFiles('apps/unified-shell/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: OpenOfficeRS-iOS-IPA
          path: apps/unified-shell/OpenOfficeRS-iOS.ipa
          if-no-files-found: warn
